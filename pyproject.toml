[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "op-opsdevnz"
version = "0.1.0"
description = "OpsDev.nz helpers for resolving 1Password secrets with Service Account + CLI fallback."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "OpsDev.nz"}]
dependencies = [
    "onepassword-sdk>=0.3.1; python_version>='3.9'",
    "python-dotenv>=1.0.0",
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.6.0",
    "mypy>=1.12.0",
]

[project.scripts]
op-opsdevnz = "opsdevnz.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
where = ["src"]
