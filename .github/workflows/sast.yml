name: SAST

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 8 * * 1" # Weekly on Monday at 08:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    # Policy (see SECURITY.md): medium severity and above fails the build.
    # Low-severity findings (e.g. accepted subprocess usage) are still
    # reported to the Security tab via SARIF.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install bandit
        run: pip install bandit

      - name: Run bandit (fails on medium+ severity)
        run: bandit -r src/ -ll -f sarif -o bandit-results.sarif

      - name: Upload bandit results
        if: always() && hashFiles('bandit-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif

  pip-audit:
    # Policy (see SECURITY.md): audit the project's own dependency set;
    # known vulnerabilities fail the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install project and pip-audit
        run: |
          pip install --upgrade pip
          pip install . pip-audit

      - name: Audit project dependencies
        run: pip-audit
